<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq Chat Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: -apple-system, BlinkMacSystemFont, sans-serif}
body{background:#0a0a0a;color:#fff;height:100vh;display:flex;flex-direction:column}
header{padding:16px 20px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}
header span{font-size:12px;color:#888;background:#1a1a1a;padding:4px 8px;border-radius:20px}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#1e1e1e;color:#e5e5e5;border-bottom-left-radius:4px;border:1px solid #2a2a2a}
.input-wrap{padding:12px;background:#0a0a0a;border-top:1px solid #222;display:flex;gap:10px;align-items:center;position:sticky;bottom:0}
#prompt{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:25px;padding:12px 18px;color:#fff;outline:none;font-size:15px}
#prompt:focus{border-color:#444}
button{background:#fff;color:#000;border:none;border-radius:50%;width:42px;height:42px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}
button:active{transform:scale(0.95)}
.hint{text-align:center;color:#555;font-size:13px;padding:10px}
</style>
</head>
<body>
<header>
  <b>Groq Chat Pro</b>
  <span>LPU ⚡ low data</span>
</header>
<div id="chat">
  <div class="hint">Built by you • Backend: Termux / Render • Powered by Groq openai/gpt-oss-20b</div>
  <div class="msg ai">Sharp boss! I be your own ChatGPT. No key for frontend again, everything dey pass your backend. Ask me anything.</div>
</div>
<div class="input-wrap">
  <input id="prompt" placeholder="Ask anything..." autocomplete="off" />
  <button id="send">↑</button>
</div>

<script>
const chat = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');

function addMsg(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send(){
  const text = promptEl.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  promptEl.value = '';
  const loader = addMsg('●●●', 'ai');
  
  try{
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    loader.remove();
    if(data.error){
      addMsg('Error: ' + (data.error.message || JSON.stringify(data.error)), 'ai');
    } else {
      addMsg(data.reply, 'ai');
    }
  } catch(e){
    loader.remove();
    addMsg('Network error: ' + e.message + '\nMake sure node server.js dey run for Termux.', 'ai');
  }
}

sendBtn.onclick = send;
promptEl.addEventListener('keydown', e=>{
  if(e.key==='Enter') send();
});
</script>
</body>
</html>
